[phases.setup]
nixPkgs = ["...", "python311Packages.supervisor", "libzip", "php83Extensions.zip"]
aptPkgs = ["...", "postgresql-client", "libzip-dev"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "composer install --no-dev --optimize-autoloader",
    "npm install --frozen-lockfile",
    "mkdir -p bin && curl -fsSL -o /tmp/tusd.tar.gz https://github.com/tus/tusd/releases/download/v2.8.0/tusd_linux_amd64.tar.gz && tar -xzf /tmp/tusd.tar.gz -C /tmp && install -m 0755 \"$(find /tmp -name tusd -type f | head -n1)\" bin/tusd && chmod +x _docker/tusd/run.sh"
]

[phases.build]
cmds = [
    "npm run build",

    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",
]


[start]
cmd = '/assets/start.sh'

[staticAssets]
"start.sh" = '''
#!/bin/bash

cd /app

# Создаём storage-папки в рантайме, после всех COPY
mkdir -p \
    storage/framework/views \
    storage/framework/cache/data \
    storage/framework/sessions \
    storage/logs \
    bootstrap/cache

# Права для www-data (под ним бежит php-fpm и nginx)
chown -R www-data:www-data storage bootstrap/cache
chmod -R 775 storage bootstrap/cache

# Чистим закэшированные на этапе билда конфиги
php artisan config:clear
php artisan cache:clear
php artisan view:clear

# Пересоздаём симлинк public/storage -> storage/app/public (теряется при каждом деплое)
php artisan storage:link --force

# Миграции — на старте, когда БД уже доступна
php artisan migrate --force
php artisan tus:ensure-lifecycle || true

chmod +x /app/_docker/tusd/run.sh || true
if [ ! -x /app/bin/tusd ]; then
  echo "tusd binary missing, downloading…"
  mkdir -p /app/bin
  curl -fsSL -o /tmp/tusd.tar.gz https://github.com/tus/tusd/releases/download/v2.8.0/tusd_linux_amd64.tar.gz
  tar -xzf /tmp/tusd.tar.gz -C /tmp
  install -m 0755 "$(find /tmp -name tusd -type f | head -n1)" /app/bin/tusd
fi

# Transform the nginx configuration
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Supervisor program files live in /etc which some runtimes reset; copy at boot.
mkdir -p /etc/supervisor/conf.d /var/log
cp /assets/worker-*.conf /etc/supervisor/conf.d/
cp /assets/supervisord.conf /etc/supervisord.conf

# Start supervisor
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-tusd.conf" = '''
[program:worker-tusd]
command=php /app/artisan tus:serve
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startsecs=2
stdout_logfile=/var/log/worker-tusd.log
stderr_logfile=/var/log/worker-tusd.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=12 # To reduce memory/CPU usage, change to 2.
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
; Album galleries accept video. The ceiling is 200M to match what the local
; Herd machine already allows — otherwise large uploads fail only in production.
; post_max_size sits above upload_max_filesize to leave room for the rest of the
; multipart body.
php_admin_value[post_max_size] = 210M
php_admin_value[upload_max_filesize] = 200M
; Without these a 200M upload fails on TIME rather than on size.
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300
request_terminate_timeout = 300s
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  # Default: 1024
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128; # this seems to be required for some vhosts

    map $http_x_forwarded_proto $tus_forwarded_proto {
        ~*^https  https;
        ~*^http   http;
        default   $scheme;
    }

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        add_header X-Content-Type-Options "nosniff";

        # Must stay >= php post_max_size, or nginx rejects the upload before PHP
        # ever sees it.
        client_max_body_size 210M;

        # A 200M upload over a slow connection needs a long read window; the
        # defaults (60s) drop it mid-transfer.
        client_body_timeout 300s;
        client_header_timeout 300s;
        send_timeout 300s;

        index index.php;

        charset utf-8;

        location /tus {
            proxy_pass http://127.0.0.1:1080;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $tus_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Cookie $http_cookie;
            client_max_body_size 0;
            client_body_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        $if(NIXPACKS_PHP_FALLBACK_PATH) (
            location / {
                try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
            }
        ) else (
          location / {
                try_files $uri $uri/ /index.php?$query_string;
           }
        )

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location ~ \.php$ {
            fastcgi_buffer_size 8k;
            # Match the PHP-FPM request_terminate_timeout so nginx does not give
            # up on a large upload before PHP has finished storing it.
            fastcgi_read_timeout 300s;
            fastcgi_send_timeout 300s;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
